# Conditional order engine configuration
spring.application.name=conditional-order-engine-java

# Directory of the durable append-only event log (created on startup).
coengine.data-dir=data/coengine
coengine.event-log-file=events.log

# Default price source used for trigger evaluation when an order omits it:
# LAST (last traded price), BID (best bid) or ASK (best ask).
coengine.default-price-source=LAST

# Default adverse slippage cap for market orders, in basis points (50 = 0.50%).
coengine.default-max-slippage-bps=50

# fsync the event log after every append before acknowledging the operation.
coengine.fsync-per-append=true
